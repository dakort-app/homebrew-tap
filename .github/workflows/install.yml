# On every push (goreleaser's included): install the cask on a Mac the way
# a person would (tap the repo, install by name), and run the binary. The
# first public install failed on a cask Homebrew refused (2026-11-10);
# this would have caught it. Homebrew will not install a cask from a file
# path, so the tap is added from this very checkout.
name: install
on:
  push:
  workflow_dispatch:

jobs:
  brew:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew tap dakort-app/tap "$PWD"
      - run: brew install dakort-app/tap/dakort
      - run: dakort -version
      - run: brew uninstall --cask dakort
